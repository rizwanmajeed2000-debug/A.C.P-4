
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7ff;
        }

        nav {
            background: #6c63ff;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            color: white;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .contact {
            text-align: center;
            padding: 70px 20px;
        }

        .form-box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            margin-top: 15px;
            padding: 12px 20px;
            border: none;
            background: #6c63ff;
            color: white;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background: #554bdb;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <nav>

        <h1>Javeria.</h1>

        <ul>
            <li><a href="main.html">Home</a></li>
            <li><a href="projets.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>

    </nav>

    <section class="contact">

        <div class="form-box">

            <h2>Contact Me 📩</h2>

            <input type="text" placeholder="Your Name">

            <input type="email" placeholder="Your Email">

            <textarea rows="5" placeholder="Your Message"></textarea>

            <button>Send</button>

        </div>

    </section>

    <footer>
        <p>© 2026 Javeria Portfolio</p>
    </footer>

</body>

</html>
