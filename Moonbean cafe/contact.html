<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | MoonBean Cafe</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f7efe5;
        }

        nav {
            background: #5c3d2e;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1,
        nav a {
            color: white;
        }

        nav ul {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        nav a {
            text-decoration: none;
        }

        .contact {
            width: 85%;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        input,
        textarea {
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            padding: 14px;
            border: none;
            border-radius: 20px;
            background: #5c3d2e;
            color: white;
            font-size: 17px;
            cursor: pointer;
            
            transition: 0.3s;
        }

        button:hover {
            background: #7a523f;
        }

        footer {
            background: #5c3d2e;
            color: white;
            text-align: center;
            padding: 20px;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            margin-top: 40px;
        }
    </style>
    </head>
    
    <body>
    
        <nav>
            <h1>☕ MoonBean Cafe</h1>
    
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    
        <section class="contact">
            <h2>Contact Us</h2>
    
            <form onsubmit="sendMessage(event)">
                <input type="text" placeholder="Enter your name" required>
                <input type="email" placeholder="Enter your email" required>
                <textarea rows="6" placeholder="Your message"></textarea>
                <button type="submit">Send Message</button>
            </form>
        </section>
    
        <footer>
            <p>Stay warm, stay caffeinated ☕</p>
        </footer>
    
        <script>
            function sendMessage(event) {
                event.preventDefault();
                alert("Your message has been sent successfully!");
            }
        </script>
    
    </body>
    
    </html>
